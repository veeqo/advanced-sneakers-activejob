name: Main

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    container: ruby:${{ matrix.ruby }}

    services:
      rabbitmq:
        image: rabbitmq:${{ matrix.rabbitmq }}
        options: >-
          --health-cmd "rabbitmq-diagnostics -q listeners"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        ruby:
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
        gemfile:
          - gemfiles/activejob_6.0.x.gemfile
          - gemfiles/activejob_6.1.x.gemfile
          - gemfiles/activejob_7.0.x.gemfile
          - gemfiles/activejob_7.1.x.gemfile
          - gemfiles/activejob_7.2.x.gemfile
          - gemfiles/activejob_8.0.x.gemfile
          - gemfiles/activejob_8.1.x.gemfile
        rabbitmq:
          - '3.8-management-alpine'
        include:
          # --- RabbitMQ 4.x on modern stacks ---
          - ruby: '4.0'
            gemfile: gemfiles/activejob_8.0.x.gemfile
            rabbitmq: '4.3-management'
          - ruby: '4.0'
            gemfile: gemfiles/activejob_8.1.x.gemfile
            rabbitmq: '4.3-management'
          - ruby: '3.4'
            gemfile: gemfiles/activejob_8.0.x.gemfile
            rabbitmq: '4.3-management'
          - ruby: '3.4'
            gemfile: gemfiles/activejob_8.1.x.gemfile
            rabbitmq: '4.3-management'
        exclude:
          # --- Rails 7.2 (Requires Ruby 3.1+) ---
          - ruby: '3.1'
            gemfile: gemfiles/activejob_7.2.x.gemfile

          # --- Rails 8.0 & 8.1 (Requires Ruby 3.2+) ---
          - ruby: '3.1'
            gemfile: gemfiles/activejob_8.0.x.gemfile
          - ruby: '3.1'
            gemfile: gemfiles/activejob_8.1.x.gemfile

          # --- Rails 6.0 & 6.1 (Upper Bounds) ---
          # Rails 6.0 and 6.1 do not officially support Ruby 3.1+ (many gems break)
          - ruby: '3.2'
            gemfile: gemfiles/activejob_6.0.x.gemfile
          - ruby: '3.2'
            gemfile: gemfiles/activejob_6.1.x.gemfile
          - ruby: '3.3'
            gemfile: gemfiles/activejob_6.0.x.gemfile
          - ruby: '3.3'
            gemfile: gemfiles/activejob_6.1.x.gemfile
          - ruby: '3.4'
            gemfile: gemfiles/activejob_6.0.x.gemfile
          - ruby: '3.4'
            gemfile: gemfiles/activejob_6.1.x.gemfile

          # --- Ruby 4.0 (Lower Bounds) ---
          # Ruby 4.0 is too new for Rails <= 7.2
          - ruby: '4.0'
            gemfile: gemfiles/activejob_6.0.x.gemfile
          - ruby: '4.0'
            gemfile: gemfiles/activejob_6.1.x.gemfile
          - ruby: '4.0'
            gemfile: gemfiles/activejob_7.0.x.gemfile
          - ruby: '4.0'
            gemfile: gemfiles/activejob_7.1.x.gemfile
          - ruby: '4.0'
            gemfile: gemfiles/activejob_7.2.x.gemfile
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install dependencies
      env:
        BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      run: |
        bundle install --jobs 4 --retry 3
    - name: Run the default task
      env:
        BUNDLE_GEMFILE: ${{ matrix.gemfile }}
        RABBITMQ_URL: amqp://guest:guest@rabbitmq/advanced_sneakers
      run: rake
